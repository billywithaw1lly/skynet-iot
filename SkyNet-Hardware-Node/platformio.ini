; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno_r4_wifi]
platform  = renesas-ra
board     = uno_r4_wifi
framework = arduino
monitor_port = /dev/cu.usbmodem9888E008EFC42

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    https://github.com/adafruit/Adafruit-BMP085-Library
    https://github.com/adafruit/Adafruit_Sensor
    https://github.com/adafruit/DHT-sensor-library
    https://github.com/adafruit/RTClib
    https://github.com/adafruit/Adafruit_BusIO
    arduino-libraries/SD @ ^1.2.4

lib_extra_dirs =
    ~/.platformio/packages/framework-arduinorenesas-uno/libraries/SPI
    ~/.platformio/packages/framework-arduinorenesas-uno/libraries/Wire
    ~/.platformio/packages/framework-arduinorenesas-uno/libraries/SD